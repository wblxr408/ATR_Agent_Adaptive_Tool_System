[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atr-runtime"
version = "0.3.1"
description = "Single-user adaptive tool runtime with controlled execution"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
integration = ["mcp>=2.2,<2.3"]

[project.scripts]
atr = "atr.cli:main"
atr-native = "atr.client_install:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema>=4.23"]

[tool.hatch.build.targets.wheel]
packages = ["atr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sandbox: real Docker boundary behavior (requires prepared image)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true

